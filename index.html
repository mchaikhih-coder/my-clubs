<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أنديتي</title>
  <style>
    body { font-family: Tahoma; background:#f5f1e8; padding:20px; }
    h1 { color:#7a1f2b; }
    input, button { padding:10px; font-size:16px; }
    li { background:white; margin:6px 0; padding:10px; border-radius:8px; }
  </style>
</head>
<body>
  <h1>الأندية الطلابية</h1>
  <input id="clubName" placeholder="اسم النادي">
  <button onclick="addClub()">إضافة</button>
  <ul id="list"></ul>

  <script>
    function addClub() {
      const name = document.getElementById("clubName").value;
      if (name === "") return;
      const li = document.createElement("li");
      li.textContent = name;
      document.getElementById("list").appendChild(li);
      document.getElementById("clubName").value = "";
    }
  </script>
</body>
</html>
